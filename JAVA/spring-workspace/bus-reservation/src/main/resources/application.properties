spring.application.name=bus-reservation
server.port=8085
server.servlet.context-path=/busreservation


# MySQL Database properties
spring.datasource.url=jdbc:mysql://localhost:3306/busreservation?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=MyPass123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hiberanate - JPA Properties
# Tables will be created Automatically in the Database
# update - Creates table & updates data into table
# create - Creates new table & adds records for each server restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
